name: Genshin showcase collector

on:
  push:
    branches:
      - main
      - feat/genshin-showcase-collector
    paths-ignore:
      - 'data/genshin/**'
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: genshin-showcase-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate collector
        run: python -m unittest discover -s tests -p test_genshin_showcase.py -v
      - name: Fetch public showcase
        run: python tools/genshin_showcase.py --uid 654252915 --output data/genshin/showcase.json --markdown data/genshin/showcase.md
      - name: Show normalized roster
        run: cat data/genshin/showcase.md
      - name: Save run artifact
        uses: actions/upload-artifact@v4
        with:
          name: genshin-showcase
          path: |
            data/genshin/showcase.json
            data/genshin/showcase.md
          retention-days: 14
      - name: Publish latest snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/genshin/showcase.json data/genshin/showcase.md
          if git diff --cached --quiet; then
            echo "No showcase changes to publish."
          else
            git commit -m "data(genshin): refresh showcase [skip ci]"
            git push
          fi
