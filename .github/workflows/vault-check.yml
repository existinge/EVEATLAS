name: EVEATLAS checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit markdown and sensitive patterns
        run: python tools/atlas.py audit
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify scorer sample
        run: python tools/opportunities.py score data/opportunities.example.json
