name: BL Engine v3 tests
on:
  push:
    branches: [feat/bl-engine-v3-gates]
  pull_request:
    paths: ['BL-ENGINE/**', '.github/workflows/bl-engine-v3.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s BL-ENGINE/tests -v
